sources:
  support-db:
    kind: postgres
    host: 127.0.0.1
    port: "5432"
    database: support
    user: toolbox
    password: ${TOOLBOX_DB_PASSWORD}

tools:
  get-order-status:
    kind: postgres-sql
    source: support-db
    description: Return one order only when it belongs to customer_email. The email is bound from the logged-in session.
    parameters:
      - name: order_id
        type: integer
        description: The order id the customer asked about.
      - name: customer_email
        type: string
        description: The logged-in customer's email. Bound from the session, not chosen by the model.
    statement: >
      SELECT order_id, customer_email, delivery_address, status, items, order_date, total_amount
      FROM customer_orders
      WHERE order_id = $1 AND customer_email = $2

  find-customer-orders:
    kind: postgres-sql
    source: support-db
    description: Return this customer's orders, newest first. The email is bound from the logged-in session.
    parameters:
      - name: customer_email
        type: string
        description: The logged-in customer's email. Bound from the session, not chosen by the model.
    statement: >
      SELECT order_id, customer_email, delivery_address, status, items, order_date, total_amount
      FROM customer_orders
      WHERE customer_email = $1
      ORDER BY order_date DESC

  action-log:
    kind: postgres-sql
    source: support-db
    description: Record a requested change. Does not update customer_orders. Rejects an order_id the user does not own.
    parameters:
      - name: user_email
        type: string
        description: The logged-in customer's email. Bound from the session, not chosen by the model.
      - name: action_type
        type: string
        description: One of CANCEL_ORDER, RETURN_ORDER, UPDATE_ADDRESS, UPDATE_PREFERENCE, UPDATE_PROFILE.
      - name: parameters
        type: string
        description: A JSON object. Include order_id when the request names an order.
    statement: >
      INSERT INTO actions_log (user_email, action_type, parameters)
      SELECT $1, $2, $3::jsonb
      WHERE ($3::jsonb ->> 'order_id') IS NULL
         OR EXISTS (
           SELECT 1 FROM customer_orders
           WHERE customer_email = $1
             AND order_id = ($3::jsonb ->> 'order_id')::integer
         )
      RETURNING id, user_email, action_type, parameters

  snapshot-orders:
    kind: postgres-sql
    source: support-db
    description: Read every order row for the eval runner. The agent never loads this tool.
    parameters:
      - name: limit_rows
        type: integer
        description: Maximum rows to return. The runner passes 100.
    statement: >
      SELECT order_id, customer_email, delivery_address, status, items::text, total_amount
      FROM customer_orders
      ORDER BY order_id
      LIMIT $1

  get-user:
    kind: postgres-sql
    source: support-db
    description: Look up one user by email for CLI login. The agent never loads this tool.
    parameters:
      - name: email
        type: string
        description: The email the person typed at the login prompt.
    statement: >
      SELECT email, full_name, password, is_premium_customer
      FROM users
      WHERE email = $1

toolsets:
  support-agent:
    - get-order-status
    - find-customer-orders
    - action-log
  login:
    - get-user
  eval:
    - snapshot-orders
